# v1 configuration: the original pipeline, kept unchanged so its results
# can be reproduced. Experiment configs in configs/experiments/ inherit from
# this file with `base:` and override only what they change.

project:
  run_name: hippocampus_unet_baseline
  seed: 42            # training seed (weights, sampling, augmentation)

dataset:
  root_dir: data
  task: Task04_Hippocampus

split:
  # Internal labelled split from MSD training data
  # Official MSD test images do not have labels
  val_frac: 0.15
  test_frac: 0.15
  seed: 42            # split seed; never changes with the training seed
  train_cases: null   # int -> train on this many cases only (overfitting study)

preprocessing:
  pixdim: [1.0, 1.0, 1.0]
  patch_size: [32, 32, 32]
  crop_foreground: after_norm   # after_norm (v1) | before_norm | none
  crop_margin: 5
  num_samples: 4
  pos: 2.0
  neg: 1.0

augmentation:
  level: full         # full (v1) | anatomical | none
  rot90: true         # 90-degree axial rotations within "full"; needs a square axial patch

model:
  arch: monai         # monai (v1) | custom (UNet3D in src/models.py)
  in_channels: 1
  num_classes: 3
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2    # custom arch: >0 means residual conv blocks
  norm: instance      # instance | batch
  use_skips: true     # custom arch only
  dropout: 0.1

training:
  epochs: 100
  val_interval: 2
  batch_size: 2
  lr: 0.0001
  weight_decay: 0.00001
  loss: dicece        # dicece | dice | ce
  scheduler: none     # none | cosine
  min_lr_ratio: 0.01
  samples_per_epoch: null
  train_eval_cases: 20
  cache_rate: 0.0
  num_workers: 2

inference:
  roi_size: [64, 64, 64]
  sw_batch_size: 2
  overlap: 0.5

uncertainty:
  mc_samples: 20

calibration:
  n_bins: 15

experiments:
  low_data_fractions: [1.0, 0.5, 0.25, 0.1]

paths:
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  uncertainty_dir: outputs/uncertainty_maps
  figures_dir: reports/figures
